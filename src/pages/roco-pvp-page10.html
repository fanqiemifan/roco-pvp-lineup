<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洛克王国PVP - 推流页面10（胜者结算画面）</title>
    <!-- 复用推流页面1 的 petsdiv3 样式（阵容精灵卡） -->
    <link rel="stylesheet" href="/styles/roco-pvp-lineup.css">
    <link rel="stylesheet" href="/styles/roco-pvp-page10.css">
    <link rel="stylesheet" href="/styles/stage-enter.css">
    <link rel="icon" type="image/svg+xml" href="/assets/ui/logo.svg">
</head>
<body>
    <!--
        胜者结算画面：赛事面板登记本局胜负时，若当前推流画面为页面1-3，
        后端会自动切入本页，停留设定时长后自动切回；也可在后台手动切换。
        展示内容取自当前活跃比赛「最近一个已分胜负小局」的胜者：
        例如 BO5 打到第 3 局，第 3 局已分胜负则取第 3 局胜者，第 3 局进行中则取第 2 局胜者。
    -->
    <main class="page10-screen" aria-label="洛克王国PVP胜者结算画面">
        <!-- 前景层：1920x814，叠加 page10-back.png -->
        <div class="page10-fore" aria-hidden="true"></div>

        <!-- 副标题 + 主标题（头像 + 获胜选手名字） -->
        <section class="page10-hero fx-enter" aria-label="本局比赛获胜者">
            <div class="page10-subtitle">本局比赛获胜者</div>
            <div class="page10-winner">
                <div class="page10-avatar"><img id="page10Avatar" alt="获胜选手头像"></div>
                <div class="page10-name" id="page10Name">待定</div>
            </div>
        </section>

        <!-- 获胜方阵容：复用推流页面1 的 petsdiv3 -->
        <section class="winner-lineup-div fx-enter" aria-label="获胜方阵容" style="--fx-delay:150ms">
            <div class="winner-lineup-pets" id="page10Pets"></div>
        </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/scripts/page10-display.js"></script>
    <script src="/scripts/stage-enter.js"></script>
</body>
</html>
