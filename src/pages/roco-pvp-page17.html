<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洛克王国PVP - 推流页面17（阵容展示5）</title>
    <link rel="stylesheet" href="/styles/petscard2.css">
    <link rel="stylesheet" href="/styles/roco-pvp-page17.css">
    <link rel="icon" type="image/svg+xml" href="/assets/ui/logo.svg">
</head>
<body>
    <main class="page17-screen" aria-label="洛克王国PVP阵容展示5">
        <!-- 比分栏：结构与几何复用 page3，黑色主题（见 roco-pvp-page17.css） -->
        <section class="page17-scoreboard" id="page17Scoreboard" aria-label="比分栏">
            <div class="page17-scoreboard-track"></div>

            <div class="page17-player page17-player-left">
                <div class="page17-player-avatar page17-player-avatar-left">
                    <img id="page17LeftAvatarImage" alt="左侧选手头像">
                    <span id="page17LeftAvatar">L</span>
                </div>
                <div class="page17-player-name" id="page17LeftName"></div>
            </div>

            <div class="page17-scoreboard-center">
                <div class="page17-scoreboard-center-back"></div>
                <div class="page17-score page17-score-left" id="page17LeftScore">0</div>
                <div class="page17-versus">
                    <div class="page17-versus-main">VS</div>
                    <div class="page17-versus-sub" id="page17BestOf">BO7</div>
                </div>
                <div class="page17-score page17-score-right" id="page17RightScore">0</div>
            </div>

            <div class="page17-rank page17-rank-left" id="page17LeftRank" hidden aria-hidden="true">
                <img src="/assets/ui/7.Wku3bA4b.png" alt="">
                <div class="page17-rank-txt"></div>
            </div>

            <div class="page17-rank page17-rank-right" id="page17RightRank" hidden aria-hidden="true">
                <img src="/assets/ui/7.Wku3bA4b.png" alt="">
                <div class="page17-rank-txt"></div>
            </div>

            <div class="page17-player page17-player-right">
                <div class="page17-player-name" id="page17RightName"></div>
                <div class="page17-player-avatar page17-player-avatar-right">
                    <img id="page17RightAvatarImage" alt="右侧选手头像">
                    <span id="page17RightAvatar">R</span>
                </div>
            </div>
        </section>

        <!-- 双方阵容：petscard2 卡片由 page17-display.js 按双方 1-12 排名直接挂到画面上
             （left/top/z-index 内联注入，位置互换带平移过渡，坐标见 roco-pvp-page17.css） -->
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/scripts/petscard.js"></script>
    <script src="/scripts/page16-rank.js"></script>
    <script src="/scripts/petscard2.js"></script>
    <script src="/scripts/page17-display.js"></script>
</body>
</html>
