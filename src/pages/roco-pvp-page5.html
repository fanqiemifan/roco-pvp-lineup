<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洛克王国PVP - 推流页面5（登场/胜率排行）</title>
    <link rel="stylesheet" href="/styles/sprite-pet-card.css">
    <link rel="stylesheet" href="/styles/roco-pvp-page5.css">
    <link rel="stylesheet" href="/styles/stage-enter.css">
    <link rel="icon" type="image/svg+xml" href="/assets/ui/logo.svg">
</head>
<body>
    <main class="page5-screen" aria-label="洛克王国PVP登场胜率排行">

        <div class="page5-content fx-enter" style="--fx-delay:120ms">
            <section class="page5-column page5-column-left" aria-label="第1-5名">

                    <span class="page5-header-item page5-header-count">登场</span>
                    <span class="page5-header-item page5-header-wins">胜率</span>
                </div>
                <div class="page5-rows" id="page5RowsLeft"></div>
            </section>

            <section class="page5-column page5-column-right" aria-label="第6-10名">
                <div class="page5-table-header">
                    <span class="page5-header-item page5-header-count">登场</span>
                    <span class="page5-header-item page5-header-wins">胜率</span>
                </div>
                <div class="page5-rows" id="page5RowsRight"></div>
            </section>
        </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/scripts/sprite-pet-card.js"></script>
    <script src="/scripts/page5-display.js"></script>
    <script src="/scripts/stage-enter.js"></script>
