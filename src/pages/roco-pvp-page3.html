<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洛克王国PVP - 推流页面3</title>
    <link rel="stylesheet" href="/styles/sprite-pet-card.css">
    <link rel="stylesheet" href="/styles/roco-pvp-page3.css">
    <link rel="stylesheet" href="/styles/stage-enter.css">
    <link rel="icon" type="image/svg+xml" href="/assets/ui/logo.svg">
</head>
<body>
    <main class="page3-screen" aria-label="洛克王国PVP推流页面3">
        <section class="page3-lineup page3-lineup-left" aria-label="左侧阵容">
            <article class="page3-spirit-slot" data-side="left" data-slot="0"></article>
            <article class="page3-spirit-slot" data-side="left" data-slot="1"></article>
            <article class="page3-spirit-slot" data-side="left" data-slot="2"></article>
            <article class="page3-spirit-slot" data-side="left" data-slot="3"></article>
            <article class="page3-spirit-slot" data-side="left" data-slot="4"></article>
            <article class="page3-spirit-slot" data-side="left" data-slot="5"></article>
        </section>

        <section class="page3-lineup page3-lineup-right" aria-label="右侧阵容">
            <article class="page3-spirit-slot" data-side="right" data-slot="0"></article>
            <article class="page3-spirit-slot" data-side="right" data-slot="1"></article>
            <article class="page3-spirit-slot" data-side="right" data-slot="2"></article>
            <article class="page3-spirit-slot" data-side="right" data-slot="3"></article>
            <article class="page3-spirit-slot" data-side="right" data-slot="4"></article>
            <article class="page3-spirit-slot" data-side="right" data-slot="5"></article>
        </section>

        <div id="page3LineupExitLayer" class="page3-lineup-exit-layer" aria-hidden="true"></div>

        <section class="page3-scoreboard fx-enter" id="page3Scoreboard" aria-label="比分栏">
            <div class="page3-scoreboard-track"></div>

            <div class="page3-player page3-player-left">
                <div class="page3-player-avatar page3-player-avatar-left">
                    <img id="page3LeftAvatarImage" alt="左侧选手头像">
                    <span id="page3LeftAvatar">L</span>
                </div>
                <div class="page3-player-name" id="page3LeftName"></div>
            </div>

            <div class="page3-scoreboard-center">
                <div class="page3-scoreboard-center-back"></div>
                <div class="page3-score page3-score-left" id="page3LeftScore">0</div>
                <div class="page3-versus">
                    <div class="page3-versus-main">VS</div>
                    <div class="page3-versus-sub" id="page3BestOf">BO7</div>
                </div>
                <div class="page3-score page3-score-right" id="page3RightScore">0</div>
            </div>

            <div class="page3-rank page3-rank-left" id="page3LeftRank" hidden aria-hidden="true">
                <img src="/assets/ui/7.Wku3bA4b.png" alt="">
                <div class="page3-rank-txt"></div>
            </div>

            <div class="page3-rank page3-rank-right" id="page3RightRank" hidden aria-hidden="true">
                <img src="/assets/ui/7.Wku3bA4b.png" alt="">
                <div class="page3-rank-txt"></div>
            </div>

            <div class="page3-player page3-player-right">
                <div class="page3-player-name" id="page3RightName"></div>
                <div class="page3-player-avatar page3-player-avatar-right">
                    <img id="page3RightAvatarImage" alt="右侧选手头像">
                    <span id="page3RightAvatar">R</span>
                </div>
            </div>
        </section>

        <div class="page3-team page3-team-left" id="page3LeftTeam" hidden aria-label="左侧战队">
            <img class="page3-team-logo" id="page3LeftTeamLogo" alt="">
            <div class="page3-team-plate">
                <img class="page3-team-name" id="page3LeftTeamName" alt="">
            </div>
        </div>

        <div class="page3-team page3-team-right" id="page3RightTeam" hidden aria-label="右侧战队">
            <img class="page3-team-logo" id="page3RightTeamLogo" alt="">
            <div class="page3-team-plate">
                <img class="page3-team-name" id="page3RightTeamName" alt="">
            </div>
        </div>

        <section class="page3-nextgame" id="page3NextGame" aria-label="下场对局" hidden>
            <div class="page3-nextgame-title">下场对局</div>
            <div class="page3-nextgame-body">
                <div class="page3-nextgame-player page3-nextgame-player-left">
                    <div class="page3-nextgame-avatar">
                        <img id="page3NextLeftAvatarImage" alt="左侧选手头像">
                    </div>
                    <div class="page3-nextgame-name" id="page3NextLeftName">
                        <span class="page3-nextgame-name-inner"></span>
                    </div>
                </div>
                <div class="page3-nextgame-player page3-nextgame-player-right">
                    <div class="page3-nextgame-avatar">
                        <img id="page3NextRightAvatarImage" alt="右侧选手头像">
                    </div>
                    <div class="page3-nextgame-name" id="page3NextRightName">
                        <span class="page3-nextgame-name-inner"></span>
                    </div>
                </div>
            </div>
            <img class="page3-nextgame-deco" src="/assets/ui/icon-for-next-game.svg" alt="">
        </section>

        <!-- 红光特效层：red-light.jpg 由脚本运行时去黑转 alpha，以滤色(screen)叠加并呼吸显示 -->
        <div class="page3-red-light" id="page3RedLight" aria-hidden="true">
            <canvas class="page3-red-light-canvas" id="page3RedLightCanvas" width="1920" height="1080"></canvas>
        </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/scripts/page3-display.js"></script>
    <script src="/scripts/stage-enter.js"></script>
</body>
</html>
