<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洛克王国PVP - 推流页面7（对局推送）</title>
    <link rel="stylesheet" href="/styles/roco-pvp-page7.css">
    <link rel="stylesheet" href="/styles/stage-enter.css">
    <link rel="icon" type="image/svg+xml" href="/assets/ui/logo.svg">
</head>
<body>
    <main class="page7-screen" aria-label="洛克王国PVP对局推送">
        <!-- 主标题：后台输入内容，字号64 YouSheBiaoTiHei 居中 -->
        <div class="page7-title fx-enter" id="page7Title"></div>
        <!-- 比赛信息行：每屏 4 行（超过一屏整屏交叉淡入淡出，不足补空占位行） -->
        <div class="page7-rows fx-enter" id="page7Rows" style="--fx-delay:120ms">
            <div class="page7-rows-track" id="page7RowsTrack"></div>
        </div>
        <!-- 温馨提示：后台可编辑 -->
        <div class="page7-notice fx-enter" id="page7Notice" style="--fx-delay:240ms"></div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/scripts/page7-display.js"></script>
    <script src="/scripts/stage-enter.js"></script>
</body>
</html>
