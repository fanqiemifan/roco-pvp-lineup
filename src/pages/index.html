<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洛克王国PVP - 推流载体</title>
    <link rel="stylesheet" href="/styles/stage-carrier.css">
    <link rel="stylesheet" href="/styles/countdown-overlay.css">
    <link rel="icon" type="image/svg+xml" href="/assets/ui/logo.svg">
</head>
<body>
    <!--
        推流载体页：本身不承载任何画面内容，仅作为一个全屏 iframe 载体。
        由后台「推流页面1设置 / 直播推流」决定要加载哪个推流页面（页面2/3/仅阵容/等待页/Overlay 等）。
        OBS 等推流软件只需固定捕获本页（http://host/），切换画面由直播推流实时下发，无需重新配置来源。
    -->
    <div class="stage-carrier" id="stageCarrier" data-stage="loading">
        <iframe
            id="stageFrame"
            class="stage-frame"
            title="推流载体"
            src="about:blank"
            allow="autoplay; fullscreen"
            allowtransparency="true"
        ></iframe>
        <div class="stage-fallback" id="stageFallback">
            <div class="stage-fallback-inner">
                <div class="stage-fallback-title">推流载体</div>
                <div class="stage-fallback-text" id="stageFallbackText">正在等待导播画面…</div>
            </div>
        </div>
        <!-- 倒计时插件：叠加在当前推流页面之上的顶部小插件（500x120 居中贴顶），
             由后台「直播推流-倒计时插件」控制显示/配色/开始/暂停/重置 -->
        <div class="countdown-overlay" id="countdownOverlay" data-theme="dark" aria-hidden="true">
            <div class="countdown-title">比赛即将开始等待选手准备中</div>
            <div class="countdown-time" id="countdownTime">00:00</div>
        </div>
        <div class="stage-transition" id="stageTransition" aria-hidden="true"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/scripts/stage-wolf-path.js"></script>
    <script src="/scripts/stage-carrier.js"></script>
    <script src="/scripts/countdown-overlay.js"></script>
</body>
</html>
