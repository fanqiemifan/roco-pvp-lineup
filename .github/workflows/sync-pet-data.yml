# 每日从上游唯一数据仓库 fanqiemifan/roco-wiki-data 同步 pets.json / final_forms.json，
# 校验与落盘逻辑都在 scripts/sync-pet-data.mjs（SHA256SUMS 校验通过才写文件）。
# 数据有变化时补跑 sync-spirits-assets.mjs 下载新增精灵图（脚本零依赖，直接 node 运行），
# 随后把数据与图片一并提交到 main；图片下载失败不阻塞数据提交（展示端对缺图有占位兜底，下次运行补齐）。
name: 同步上游精灵数据

on:
  schedule:
    - cron: '35 21 * * *' # 每日 UTC 21:35（北京时间 05:35，避开整点调度高峰）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-pet-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 拉取并校验上游数据
        run: node scripts/sync-pet-data.mjs

      - name: 补齐新增精灵图
        run: node scripts/sync-spirits-assets.mjs || echo "::warning::精灵图下载失败，本次仅提交数据，图片待下次补齐"

      - name: 有变更则提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/data/pets.json resources/data/final_forms.json resources/sprites-img resources/sprites-icon
          if git diff --cached --quiet; then
            echo "上游无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(data): 同步上游 roco-wiki-data 精灵数据"
          git push
